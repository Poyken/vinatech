function checkcommand(cnd){
   
    if(cnd.indexOf("dellot")>=0 ) return "dellot";
    if(cnd.indexOf("delweight")>=0 ) return "delweight";
    if(cnd.indexOf("delvendorlot")>=0 ) return "delvendorlot";
    if(cnd.indexOf("nextstep")>=0 ) return "nextstep";
    if(cnd.indexOf("refresh")>=0 ) return "refresh";

    return '';
}

var domVirtualScanInput = document.getElementById("virtualScanInput");
function changevirtualScanInput(control)
{
	var command = control? control.value: "";
	
	if(checkcommand(command))
		control.value="";
		
	var tmpval = command || domVirtualScanInput.value.toLowerCase().trim();
	
	if (checkcommand(tmpval)=="nextstep" && !document.getElementById("nextElectrodeStepInfo").disabled) 
		        document.getElementById("nextElectrodeStepInfo").click();//insertWeigingData();
	else if (checkcommand(tmpval)=="refresh") location.reload();
	else if (checkcommand(tmpval)=="dellot") clearelectrodeLotNumber();
	else if (checkcommand(tmpval)=="delvendorlot") clearmaterialLotNumber();
	else if (checkcommand(tmpval)=="delweight") clearMaterialWeight();

    if(checkcommand(command) || domVirtualScanInput.value.length>500)
	    domVirtualScanInput.value="";
}

function swalchange(control){
    var val1 = control.value;

    var val2 = val1.replace(/[^0-9.]/g, "");
    
    if(document.getElementsByClassName("swal2-confirm swal2-styled") && document.getElementsByClassName("swal2-confirm swal2-styled").length)
        document.getElementsByClassName("swal2-confirm swal2-styled")[0].click()

    if(!val1){
        alert("⚠ Không nhập cân nặng, nên không thể in label");
    }
    else{

        if(isFinite(parseFloat(val1)) && val1==val2  )
            if (parseFloat(val2)>65 || parseFloat(val2)<=0){
                alert("⚠ Khối lượng cân không hợp lệ hoặc vượt quá khối lượng Tổng các Nguyên liệu cho 2 BATCH");
            }
            else
            sendPrinterDefault('','',val1);
        else{
            alert("⚠ Khối lượng cân chứa kí tự không phải chữ số của cân nặng, nên không thể in label");
        }
    }
}

function connectRS232(){
    var domPortid = document.getElementById("portid");
	if(domPortid.innerHTML.length<=3){
		setTimeout(connectRS232,500);
		return;
	}
	
	if(!localStorage.defaultCOM) localStorage.defaultCOM="COM12";

	domComPort.value=localStorage.defaultCOM;
	if(domPortid.innerHTML.indexOf(localStorage.defaultCOM+'_')>=0)
		getSerialData(connectSerialPort(domComPort.value || localStorage.defaultCOM), strmaterialWeight1, strmaterialWeight2);
		
	if(!localStorage.printPort) localStorage.printPort="COM3";

	domPrintPort.value=localStorage.printPort;

	if(domPortid.innerHTML.indexOf(localStorage.printPort+'_')>=0 && localStorage.printPort!=localStorage.defaultCOM){
		labelport = connectSerialPort(domPrintPort.value || localStorage.printPort)
		getSerialData(labelport, strmaterialWeight1, strmaterialWeight2);
	}
}
