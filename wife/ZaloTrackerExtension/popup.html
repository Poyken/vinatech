<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zalo Sync</title>
  <style>
    body { font-family: Segoe UI, sans-serif; width: 300px; padding: 15px; text-align: center; background-color: #f0f2f5; }
    h3 { margin-top: 0; color: #0068ff; margin-bottom: 5px; }
    p { font-size: 12px; color: #555; margin-bottom: 15px;}
    button { background: #0068ff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; box-sizing: border-box; }
    button:hover { background: #005ce6; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #c82333; }
    button.success { background: #28a745; }
    button.success:hover { background: #218838; }
    input[type="file"] { display: none; }
    .file-upload { display: block; border: 2px dashed #0068ff; padding: 10px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; font-size: 13px; font-weight: bold; color: #0068ff; box-sizing: border-box; }
    .file-upload:hover { background: #e6f0ff; }
    #status { margin-top: 10px; font-size: 13px; font-weight: bold; color: green; white-space: pre-wrap; word-wrap: break-word;}
    hr { border: 0; border-top: 1px solid #ccc; margin: 15px 0; }
  </style>
</head>
<body>
  <h3>Tình Báo EA Team</h3>
  <p>1. Lần đầu: Nhập file Zalo_Chat_Thao_Perfect.txt làm gốc<br>2. Hằng ngày: Mở Zalo Web và Đồng Bộ.</p>
  
  <label class="file-upload">
    <input type="file" id="importFile" accept=".txt">
    📥 1. Nạp File Gốc (.txt)
  </label>
  
  <button id="syncBtn" class="success">🚀 2. Đồng Bộ Hằng Ngày Mới</button>
  
  <hr>
  <button id="exportBtn">💾 Xuất File Data Hiện Tại</button>
  <button id="clearBtn" class="danger">🗑️ Xóa Trắng Bộ Nhớ</button>
  
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
