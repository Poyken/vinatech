    <script>

        sessionStorage.isCell = 1;

        function setRemarkName(id) {
            var remark = id.value;
            if (!localStorage.nameremark || localStorage.nameremark != remark) {
                localStorage.nameremark = remark;
                localStorage.nameremarkBegin = new Date().toISOString();
            }
        }

        Date.prototype.addHours = function (h) {
            this.setTime(this.getTime() + (h * 60 * 60 * 1000));
            return this;
        }

        if (localStorage.nameremark) {
            if (new Date(localStorage.nameremarkBegin).addHours(12) <= new Date()) {
                localStorage.nameremark = '';
                localStorage.nameremarkBegin = new Date().toISOString();
            }
            else {
                var elmnt = document.getElementById("remark");
                for (var i = 0; i < elmnt.options.length; i++) {
                    console.log(elmnt.options[i].value);
                    if (elmnt.options[i].value == localStorage.nameremark) {
                        elmnt.selectedIndex = i;
                        break;
                    }
                }
                //document.getElementById("remark").selectedIndex  = 1;//localStorage.nameremark;
            }
        }



        function delgross() {
            document.getElementById("defectWeight").value = "";

        function checkdata() {
            checkStandardQuantity(document.getElementById("LotPacking").value);

        // thay đổi só lượng realtime
        var demsotuibong = 0;
        var laysocan = 0;



        function autocan() {
            laysocan = document.getElementById("textpcs").value
            if (parseInt(laysocan) >= parseInt(sessionStorage.tieuchuantui1)) {
                demsotuibong++;
                //console.log(demsotuibong)
                document.getElementById("demsolancan").innerHTML = demsotuibong

                if (sessionStorage.sotuibong1 == demsotuibong) {
                    //callElectrodeWasteSubmitProc();
                    //document.getElementById("textpcs").removeEventListener('input', myFunction);
                    //removeEventListener("input",processChanges)
                    //sessionStorage.clear();
                    alert('⚡ OK, gửi thành công!...');
                    //callElectrodeWasteSubmitProc();
                    demsotuibong = 0;
                    document.getElementById("demsolancan").innerHTML = demsotuibong
                }

            }
        }

        // hàm này để trì hoãn thì người dùng k nhập 1 thời gian thì mới nhận diện để gửi đi
        function debounce(func, timeout = 1000) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }

        function saveInput() {
            autocan()
        }

        const processChanges = debounce(() => saveInput());

        // xác nhận tiêu chuẩn cân cho các túi  
        // khi xong thì ađ oninput="myChangePcs()" để tự động lấy cân
        function confirmStandardQuantity() {
            if (!sessionStorage.soluongsettinglocal) {
                alert('⚠ Bạn chưa check data');
            }
            else {
                var pcsNumber = document.getElementById("textpcs").value;
                var tieuchuanAndtuibong = parseInt(sessionStorage.tieuchuanthua1) + parseInt(sessionStorage.tuibong1);
                if (parseInt(pcsNumber) >= parseInt(tieuchuanAndtuibong)) {
                    sessionStorage.tieuchuantui1 = pcsNumber;
                    document.getElementById("textpcs").oninput = function () { processChanges() }
                    alert('⚡ OK, Chốt số lượng tiêu chuẩn thành công!...');
                    //myChangePcs();
                }
                else
                    alert('⚠ Số lượng không đủ!...');
            }
        }
        function SendLotle() {
            var pcsNumberOdd = document.getElementById("LotPackingLotOdd").value;
            if (pcsNumberOdd != '') {
                if (!sessionStorage.soluongsettinglocal) {
                    alert('⚠ Bạn chưa check data');
                }
                else {
                    callElectrodeWasteSubmitProcLotle()
                }
            } else
                alert('⚠ Chưa bắn mã Lot lẻ');
        }

        //nhấn nút enter gọi hàm checkdata
        var txt = document.getElementById("body");
        txt.addEventListener("keyup", function (event) {
            event.preventDefault();
            if (event.keyCode == 13)
                checkdata();
        });
        //end

        if (localStorage.LotPacking && document.getElementById("LotPacking")) {
            document.getElementById("LotPacking").value = localStorage.LotPacking;
            callElectrodeStepInfoProc();
        }


        document.getElementById("LotPacking").focus();


        document.getElementById("LotPacking").addEventListener("keyup", event => {
            if (document.getElementById("LotPacking") && document.getElementById("LotPacking").value)
                localStorage.LotPacking = document.getElementById("LotPacking").value;

            getTodayStr('jobDate', '-');

            if (document.getElementById("LotPacking").value)
                if (document.getElementById("LotPacking").value.toUpperCase().indexOf('V') == 0
                    && document.getElementById("LotPacking").value.toUpperCase().indexOf('E') == 11) sessionStorage.isCell = 0;

            if (event.key == "Enter" || event.key === "Enter") {

                //callElectrodeStepInfoProc(); 
                checkStandardQuantity(document.getElementById('LotPacking').value);
            }
            event.preventDefault();
            return false;
        });


        function SelectCOM() {
            //callElectrodeStepInfoProc(); // Use `.key` instead.
            localStorage.defaultCOM = document.getElementById("COMport").value;
            console.log(localStorage.defaultCOM);

            getSerialData(connectSerialPort(document.getElementById("COMport").value || localStorage.defaultCOM), "defectWeight", "UnitW", "textpcs");
            //event.preventDefault(); // No need to `return false;`.
            return false;
        };
        if (!localStorage.defaultCOM) localStorage.defaultCOM = "COM10";
        document.getElementById("COMport").value = localStorage.defaultCOM;
        getSerialData(connectSerialPort(document.getElementById("COMport").value || localStorage.defaultCOM), "defectWeight", "UnitW", "textpcs");



        function fprintPort() {
            localStorage.printPort = document.getElementById("printPort").value;
        }
        if (!localStorage.printPort) localStorage.printPort = "COM12";
        document.getElementById("printPort").value = localStorage.printPort;






        function sendPrinterDefault(text) {

            // var step = document.getElementById("electrodeStepCode").value || '';

            // var mname = document.getElementById("materialName").value || '';

            var dat = new Date();

            dat = dat.getFullYear() + '-' + (dat.getMonth() + 1) + '-' + dat.getDate();

            var text1 = '<div style="font-size:80px;transform: rotate(-90deg);position: absolute;display:block;    left: 0px;bottom:150px;    font-weight: 700;font-family: Tahoma;"> <p>=== WASTE ===</p> <p></p> <br><p>Lot: ' + document.getElementById("LotPacking").value + '</p><p> DATE:  ' + dat + '</p> <p> TIME: ' + (new Date()).toLocaleTimeString() + ' </p> <p>Weight:  ' + text + ' Kg</p> </div>';

            window.print();
