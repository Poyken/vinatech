<script>
  sessionStorage.isCell = 1;

  function setRemarkName(id) {
    var remark = id.value;
    if (!localStorage.nameremark || localStorage.nameremark != remark) {
      localStorage.nameremark = remark;
      localStorage.nameremarkBegin = new Date().toISOString();
    }
  }

  Date.prototype.addHours = function (h) {
    this.setTime(this.getTime() + (h * 60 * 60 * 1000));
    return this;
  }

  if (localStorage.nameremark) {
    if (new Date(localStorage.nameremarkBegin).addHours(12) <= new Date()) {
      localStorage.nameremark = '';
      localStorage.nameremarkBegin = new Date().toISOString();
    }
    else {
      var elmnt = document.getElementById("remark");
      for (var i = 0; i < elmnt.options.length; i++) {
        console.log(elmnt.options[i].value);
        if (elmnt.options[i].value == localStorage.nameremark) {
          elmnt.selectedIndex = i;
          break;
        }
      }
      //document.getElementById("remark").selectedIndex  = 1;//localStorage.nameremark;
    }
  }
